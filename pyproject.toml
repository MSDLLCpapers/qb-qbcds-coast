[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coast"
version = "0.1.0"
description = "Causally Optimal Actions for State Transitions: causal-intelligence approach for constrained intervention design."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Zixuan Song" },
    { name = "Dimitris V. Manatakis" },
]
keywords = ["causal inference", "intervention design", "single-cell", "state transition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy==1.26.3",
    "pandas==2.3.1",
    "scipy==1.13.1",
    "networkx==3.2",
    "scikit-learn==1.5.0",
    "statsmodels==0.14.1",
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "dowhy==0.12",
    "gcastle==1.0.4",
    "gprofiler-official==1.0.0",
    "gseapy==1.1.8",
    "JPype1==1.4.1",
    "joblib==1.3.2",
    "tqdm==4.66.1",
    "psutil==5.9.8",
]

[project.optional-dependencies]
# R bridge (GPLv2+), which is needed only for the feature selection step and may be optional. See LICENSES_THIRD_PARTY.
r = ["rpy2==3.6.1"]

# Notebook environment for running the example analyses under results/.
notebooks = [
    "jupyterlab==4.5.11",
    "ipykernel==6.29.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coast*"]
exclude = ["results*", "figures*"]
